name: Scheduled rebuild

# The home page lists the latest posts from `site.feedUrl`, fetched at build
# time. Rebuild daily so the list does not go stale between pushes.
# DEPLOY_HOOK_URL: a deploy hook from your host (Cloudflare Pages, Netlify,
# Vercel, ...). Nothing happens while the secret is unset.
# GitHub disables scheduled workflows after 60 days without repository
# activity, and runs them on the default branch only.
on:
  schedule:
    - cron: "0 21 * * *" # 06:00 JST
  workflow_dispatch:

permissions: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call the deploy hook
        env:
          HOOK: ${{ secrets.DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "DEPLOY_HOOK_URL is not set; skipping." >&2
            exit 0
          fi
          curl -fsS -X POST "$HOOK" > /dev/null
